aid: asendia-ai
name: Asendia AI
description: >-
  Asendia AI builds AI-powered recruitment agents for staffing agencies and
  enterprise talent teams. The platform clones a top recruiter's screening logic
  and outreach style into autonomous AI agents that source, screen, and submit
  candidates around the clock across phone, SMS, WhatsApp, and email. Its AI
  interview agent ("Sarah") conducts voice screens, its AI sourcing agent uses
  semantic search to match candidates by meaning rather than keywords, and
  compatibility reports deliver ready-to-hire shortlists in hours instead of
  weeks. Asendia AI integrates with 50+ applicant tracking systems (including
  JobDiva and Recruiterflow) and serves healthcare, IT, and light-industrial
  staffing. Founded in 2025 in San Francisco and backed by Y Combinator
  (Spring 2026 batch). This profile is maintained by API Evangelist; the company
  publishes product documentation but no public developer API at this time.
